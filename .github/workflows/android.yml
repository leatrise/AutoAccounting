name: Android Release Build
permissions:
  contents: read
  actions: read

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      apk_filename: ${{ steps.detect_apk.outputs.apk_filename }}

    steps:
    - name: Set timezone
      uses: szenius/set-timezone@v1.2
      with:
        timezoneLinux: "Asia/Shanghai"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "Missing KEYSTORE_BASE64 secret"
          exit 1
        fi
        KEYSTORE_PATH="app/release.keystore"
        echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
        chmod 600 "$KEYSTORE_PATH"

    - name: Build release APK
      env:
        ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Detect APK
      id: detect_apk
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "No APK found in app/build/outputs/apk/release"
          exit 1
        fi
        echo "apk_filename=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT

    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: release-apk
        path: app/build/outputs/apk/release/
        retention-days: 30

    - name: Upload build reports (release)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports-release
        path: |
          app/build/reports/
          build/reports/
        retention-days: 7

  notify:
    runs-on: ubuntu-latest
    needs: release
    if: always() && github.event_name == 'push'

    steps:
    - name: Download release APK artifact
      if: needs.release.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: artifacts/apk

    - name: Send Telegram message and release APK
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        APK_FILENAME: ${{ needs.release.outputs.apk_filename }}
        STATUS: ${{ needs.release.result }}
        COMMIT_SHA: ${{ github.sha }}
        COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        COMMIT_MESSAGE: |+
          New push to Github\!
          \#AutoAccounting
          ```
          ${{ github.event.head_commit.message }}
          ```by `${{ github.event.head_commit.author.name }}`
          See commit detail [here](${{ github.event.head_commit.url }})
        COMMIT_URL: ${{ github.event.head_commit.url }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "Telegram notification skipped: missing TELEGRAM_BOT_TOKEN or TELEGRAM_RELEASE_CHAT_ID."
          exit 0
        fi

        if [ "$STATUS" = "success" ]; then
          APK_PATH=$(ls artifacts/apk/*.apk 2>/dev/null | head -n 1)
          TARGET_FILENAME="${APK_FILENAME:-release.apk}"
          if [ -n "$APK_PATH" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${APK_PATH};filename=${TARGET_FILENAME}" \
              -F "parse_mode=MarkdownV2" \
              --form-string "caption=${COMMIT_MESSAGE}" \
              -F "disable_web_page_preview=true"
          else
            echo "No release APK artifact found after download."
          fi
        fi
